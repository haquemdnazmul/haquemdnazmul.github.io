<text x="24" y="54" font-size="11" font-weight="400" fill="#666666" text-anchor="start" style="font-family:Consolas,'IBM Plex Mono',monospace">Full detection without battery wires: a charger that has finished stops pulling current, so the panel voltage rises back towards Voc.</text>
