<polyline points="105,450 105,560" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="105" cy="560" r="4" fill="#111111"/>
<polyline points="30,560 1160,560" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="30" y="580" font-size="11" font-weight="700" fill="#111111" text-anchor="start" style="font-family:Consolas,'IBM Plex Mono',monospace">CONTROL GND = Arduino GND = every BAT− (= PV− inside each common-negative controller)</text>
<text x="24" y="606" font-size="11" font-weight="400" fill="#666666" text-anchor="start" style="font-family:Consolas,'IBM Plex Mono',monospace">Only PV+ is switched: one relay per controller (K1, K3, K5). K2, K4, K6 are not needed. Each MOSFET drives one coil, with its own 1N4007.</text>
<text x="24" y="622" font-size="11" font-weight="400" fill="#666666" text-anchor="start" style="font-family:Consolas,'IBM Plex Mono',monospace">Needs common-negative controllers: PV− and BAT− must beep together on every controller. Never join PV− on a common-positive controller.</text>
<text x="24" y="638" font-size="11" font-weight="400" fill="#666666" text-anchor="start" style="font-family:Consolas,'IBM Plex Mono',monospace">220k/10k reads up to about 115 V (Voc 110 V gives 4.8 V on A5). For Voc 110–160 V use 330k for R18. The tap is on the PV+ bus, before the relays.</text>
<text x="24" y="654" font-size="11" font-weight="400" fill="#666666" text-anchor="start" style="font-family:Consolas,'IBM Plex Mono',monospace">Full = panel voltage stays above 95 % of Voc for 15 min while there is good sun. Voc is measured in every 10 s all-off pause.</text>
